<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>USCIS 128 Civics Test Master | California & 50 States Edition</title>
  
  <!-- Web App Manifest & PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  
  <!-- iOS Safari & macOS Web App Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Civics 128">
  <meta name="application-name" content="Civics 128">
  <meta name="theme-color" content="#0f172a">
  <meta name="msapplication-TileColor" content="#0f172a">
  <meta name="description" content="Official USCIS 128 Civics Naturalization Test study guide, 3D flashcards, quizzes, oral interview simulator, and California state-specific answers. Bookmarkable as webapp on iOS and macOS.">
  
  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Patrick+Hand&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    @supports (padding: max(0px)) {
      body {
        min-height: -webkit-fill-available;
      }
    }

    /* Coursework Classroom & Cinema Styles */
    .chalkboard-stage {
      background: radial-gradient(circle at 45% 35%, #1b3829 0%, #11261c 65%, #0a1811 100%);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
    }
    .chalk-wood-frame {
      background: #3d2314;
      border: 12px solid #2a160b;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.9);
    }
    .chalk-font {
      font-family: 'Patrick Hand', 'Caveat', -apple-system, BlinkMacSystemFont, cursive, sans-serif;
    }
    .chalk-white {
      color: #f8fafc;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.5), 1px 1px 2px rgba(0, 0, 0, 0.7);
    }
    .chalk-green {
      color: #86efac;
      text-shadow: 0 0 2px rgba(134, 239, 172, 0.6), 1px 1px 2px rgba(0, 0, 0, 0.7);
    }
    .chalk-amber {
      color: #fde047;
      text-shadow: 0 0 2px rgba(253, 224, 71, 0.6), 1px 1px 2px rgba(0, 0, 0, 0.7);
    }
    .chalk-cyan {
      color: #67e8f9;
      text-shadow: 0 0 2px rgba(103, 232, 249, 0.6), 1px 1px 2px rgba(0, 0, 0, 0.7);
    }
    @keyframes mouthTalk {
      0%, 100% { transform: scaleY(0.2) scaleX(0.9); }
      25% { transform: scaleY(1.3) scaleX(1.1); }
      50% { transform: scaleY(0.4) scaleX(0.85); }
      75% { transform: scaleY(1.4) scaleX(1.15); }
    }
    .mouth-talking {
      transform-origin: 100px 104px;
      animation: mouthTalk 0.22s infinite ease-in-out;
    }
    @keyframes eyeBlink {
      0%, 93%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
    .eye-blinking {
      animation: eyeBlink 3.8s infinite;
    }
    .eye-left {
      transform-origin: 85px 80px;
    }
    .eye-right {
      transform-origin: 115px 80px;
    }
    @keyframes batonPoint {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-10deg); }
      70% { transform: rotate(4deg); }
      85% { transform: rotate(-6deg); }
    }
    .baton-pointing {
      transform-origin: 55px 145px;
      animation: batonPoint 2.4s infinite ease-in-out;
    }
    @keyframes floatArtifact {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    .artifact-float {
      animation: floatArtifact 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">
