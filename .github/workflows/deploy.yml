name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Application & Assets
        run: |
          python3 build.py

      - name: Verify build artifacts
        run: |
          ls -la dist/
          test -f dist/index.html || exit 1

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=civics-128-app ${{ github.event_name == 'pull_request' && format('--branch={0}', github.head_ref) || '--branch=main' }}

      - name: Comment Preview URL on Pull Request
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref.replace(/[^a-zA-Z0-9-]/g, '-').toLowerCase();
            const previewUrl = `https://${branch}.civics-128-app.pages.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Cloudflare Pages Preview Deployment Ready!**\n\n🔗 **Preview URL**: [${previewUrl}](${previewUrl})\n\nBranch: \`${context.payload.pull_request.head.ref}\``
            });
